    <script>
    (function () {
        var endpoint = "/api/tiktok-event";
        var ttclidKey = "tiktok_ttclid";

        // 1. Identify & ViewContent (Theo yêu cầu TikTok)
        if (window.ttq) {
            ttq.identify({}); // Sẵn sàng cho Advanced Matching
            ttq.track('ViewContent', {
    contents: [{
        content_id: 'home_page', // Thêm dòng này
        content_name: "Trang Chủ Cổng Quốc Tế",
        content_type: "product"
    }],
    value: 0,
    currency: "VND"
});
        }

        function saveTikTokClickId() {
            var params = new URLSearchParams(window.location.search);
            var ttclid = params.get("ttclid");
            if (ttclid) {
                try { window.localStorage.setItem(ttclidKey, ttclid); } catch (e) {}
            }
        }

        function getTikTokClickId() {
            try { return window.localStorage.getItem(ttclidKey) || ""; } catch (e) { return ""; }
        }

        function createEventId(eventName) {
            return eventName + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
        }

        function sendServerEvent(payload) {
            var body = JSON.stringify(payload);
            if (navigator.sendBeacon) {
                var blob = new Blob([body], { type: "application/json" });
                if (navigator.sendBeacon(endpoint, blob)) return;
            }
            fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body,
                keepalive: true
            }).catch(function () {});
        }

        function trackTikTokClick(link) {
            var eventName = link.getAttribute("data-tiktok-event") || "ClickButton";
            var label = link.getAttribute("data-tiktok-label") || link.textContent.trim();
            var eventId = createEventId(eventName);
            
            // Cấu trúc properties đầy đủ theo yêu cầu TikTok
            var properties = {
    contents: [{
        content_id: eventName + '_' + label.replace(/\s+/g, '_').toLowerCase(), // Tạo ID tự động từ tên nút
        content_type: "product",
        content_name: label
    }],
    content_category: "outbound_link",
    value: 0,
    currency: "VND",
    description: label,
    destination_url: link.href
};

            if (window.ttq && typeof window.ttq.track === "function") {
                window.ttq.track(eventName, properties, { event_id: eventId });
            }

            sendServerEvent({
                event: eventName,
                event_id: eventId,
                ttclid: getTikTokClickId(),
                page_url: window.location.href,
                referrer: document.referrer,
                properties: properties
            });
        }

        saveTikTokClickId();

        document.addEventListener("click", function (event) {
            var link = event.target.closest("[data-tiktok-event]");
            if (!link || !link.href) return;

            trackTikTokClick(link);

            if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || (link.target && link.target !== "_self")) {
                return;
            }

            event.preventDefault();
            setTimeout(function () {
                window.location.href = link.href;
            }, 250);
        });
    }());
    </script>
